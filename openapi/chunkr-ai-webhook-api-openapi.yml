    email: ishaan@lumina.sh
  license:
    name: ''
  version: 2.66.2
servers:
- url: https://api.chunkr.ai
  description: Chunkr API
tags:
- name: Webhook
  description: Endpoints for managing webhooks
paths:
  /webhook/url:
    get:
      tags:
      - Webhook
      summary: Get webhook URL
      description: Get or create webhook for user and return dashboard URL
      operationId: get_webhook_url
      responses:
        '200':
          description: Svix App Portal URL for the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookUrlResponse'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - api_key: []
components:
  schemas:
    WebhookUrlResponse:
      type: object
      required:
      - url
      properties:
        url:
          type: string
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: Authorization
